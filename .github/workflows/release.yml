# Builds Odin 2 for MPC in GitHub Actions and attaches Odin-2-<version>-mpc-armv7.zip (Gen1, MPC OS 2.x and 3.x) and
# -mpc-aarch64.zip (Gen2) to a DRAFT release.
# Actions -> Release -> Run workflow, enter the version. Install that zip on an MPC, check it, then publish the draft
# (publishing creates the tag; the catalog picks it up).
# Release notes: write docs/releases/v<version>.md first -- what changed and what was fixed since the last release (not
# install steps; those are in INSTALL.md inside the zip). The draft's notes are that file.
# mpc-vst-plugins is pinned in both places below: the workflow (c6b4bb0 + notes from docs/releases) and its tools (c6b4bb0).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.4.8
        required: true
        type: string
      dry_run:
        description: Build and package only (zip and page previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: 3dthc/mpc-vst-plugins/.github/workflows/vst-release.yml@c2f5abf7ab537a5d1006262ac7ec47a7b37ac537
    permissions: { contents: write }
    with:
      tag: odin2-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: c6b4bb0b4939bbf64e2017bd3c11d95a080799f9
      vst_dir: vst
      build: '"$MPC_VST/tools/build_port.sh" vst/vst.json'
      host_test: '"$MPC_VST/tools/test_port.sh" vst/vst.json'
      about: Odin 2, TheWaveWarden's synthesizer, on MPC OS - Odin's own engine, 261 factory patches, voices sized to the MPC.
      plugin_id: odin2
      license: GPL-3.0-only
      dry_run: ${{ inputs.dry_run }}
